  <style>
    /* =========================================================
       VARIABLES (shared with index.html header/footer)
       ========================================================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-card: rgba(20, 20, 20, 0.85);
      --accent: #ffffff;
      --accent-dim: rgba(255, 255, 255, 0.1);
      --accent-glow: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-secondary: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(10, 10, 10, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Orbitron', 'Inter', sans-serif;
      --shadow-color: rgba(0,0,0,0.6);
      --btn-primary-bg: #ffffff;
      --btn-primary-color: #000000;
      --btn-primary-hover: #cccccc;
      --btn-secondary-border: rgba(255,255,255,0.25);
      --btn-secondary-hover-bg: rgba(255,255,255,0.1);
      --badge-bg: rgba(255,255,255,0.08);
      --badge-border: rgba(255,255,255,0.15);
      --footer-border: var(--border-subtle);
      --scrollbar-thumb: #ffffff;
      --scrollbar-track: #000000;
      --nav-bg: rgba(0,0,0,0.7);
      --nav-scrolled: rgba(0,0,0,0.95);
      --wordmark-filter: brightness(0) invert(1);
      --wave-blue: #3b82f6;
      --wave-green: #10b981;

      /* Demos page specific */
      --demo-border: rgba(255,255,255,0.10);
      --demo-border-hover: rgba(255,255,255,0.45);
      --demo-card-bg: rgba(18,18,18,0.86);
      --demo-radius: 18px;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-secondary: #eeeeee;
      --bg-card: rgba(255, 255, 255, 0.85);
      --accent: #000000;
      --accent-dim: rgba(0, 0, 0, 0.08);
      --accent-glow: rgba(0, 0, 0, 0.15);
      --text-primary: #111111;
      --text-secondary: #333333;
      --text-muted: #666666;
      --border-subtle: rgba(0, 0, 0, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(0, 0, 0, 0.12);
      --shadow-color: rgba(0,0,0,0.15);
      --btn-primary-bg: #000000;
      --btn-primary-color: #ffffff;
      --btn-primary-hover: #333333;
      --btn-secondary-border: rgba(0,0,0,0.25);
      --btn-secondary-hover-bg: rgba(0,0,0,0.08);
      --badge-bg: rgba(0,0,0,0.06);
      --badge-border: rgba(0,0,0,0.12);
      --footer-border: rgba(0,0,0,0.1);
      --scrollbar-thumb: #333333;
      --scrollbar-track: #e0e0e0;
      --nav-bg: rgba(255,255,255,0.85);
      --nav-scrolled: rgba(255,255,255,0.95);
      --wordmark-filter: brightness(0) invert(0);

      --demo-border: rgba(0,0,0,0.10);
      --demo-border-hover: rgba(0,0,0,0.35);
      --demo-card-bg: rgba(255,255,255,0.88);
    }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.3s ease;
    }
    ::selection { background: var(--accent); color: var(--bg-primary); }
    a { color: var(--text-primary); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--text-secondary); }
    img { max-width: 100%; display: block; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 2; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 12px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* =========================================================
       HEADER (auto-loaded from index.html)
       ========================================================= */
    .theme-toggle {
      display: flex; align-items: center; gap: 8px;
      background: none; border: 1px solid var(--glass-border);
      border-radius: 50px; padding: 6px 14px 6px 10px;
      color: var(--text-secondary); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; transition: all var(--transition);
      font-family: var(--font-sans); background: var(--badge-bg);
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--text-primary); background: var(--accent-dim); }
    .theme-toggle i { font-size: 0.9rem; }
    .theme-toggle .toggle-icon { display: flex; align-items: center; gap: 4px; }

    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      padding: 16px 0; background: var(--nav-bg);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      border-bottom: 1px solid var(--glass-border);
      transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    .navbar.scrolled {
      background: var(--nav-scrolled);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      box-shadow: 0 4px 25px var(--shadow-color);
    }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { display: flex; align-items: center; }
    .nav-brand .wordmark { height: 26px; width: auto; display: block; filter: var(--wordmark-filter); transition: filter 0.4s ease; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a {
      font-size: 0.875rem; font-weight: 500; color: var(--text-secondary);
      letter-spacing: 0.02em; transition: color var(--transition); position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; left: 0; bottom: -4px;
      width: 0; height: 2px; background: var(--accent);
      transition: width var(--transition); border-radius: 4px;
    }
    .nav-links a:hover { color: var(--text-primary); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--text-primary); }
    .nav-links a.active::after { width: 100%; }

    .nav-cta {
      display: inline-block; padding: 8px 20px; border-radius: 50px;
      background: var(--btn-primary-bg); color: var(--btn-primary-color) !important;
      font-weight: 600; font-size: 0.8rem; letter-spacing: 0.03em;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      border: none; cursor: pointer;
    }
    .nav-cta:hover { background: var(--btn-primary-hover); color: var(--btn-primary-color) !important; transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-glow); }
    .nav-cta::after { display: none !important; }

    .nav-dropdown { position: relative; list-style: none; }
    .nav-dropdown-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      background: none; border: none; cursor: pointer; padding: 0;
      font-family: var(--font-sans); font-size: 0.875rem; font-weight: 500;
      color: var(--text-secondary); letter-spacing: 0.02em;
      transition: color var(--transition); position: relative;
    }
    .nav-dropdown-toggle .dd-text { position: relative; }
    .nav-dropdown-toggle .dd-text::after {
      content: ''; position: absolute; left: 0; bottom: -4px;
      width: 0; height: 2px; background: var(--accent);
      transition: width var(--transition); border-radius: 4px;
    }
    .nav-dropdown-toggle:hover .dd-text { color: var(--text-primary); }
    .nav-dropdown-toggle:hover .dd-text::after { width: 100%; }
    .nav-dropdown-toggle .dd-arrow {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.6rem; transition: transform 0.3s ease;
      padding: 4px; border-radius: 4px; cursor: pointer;
    }
    .nav-dropdown-toggle .dd-arrow:hover { background: var(--accent-dim); }
    .nav-dropdown.open .nav-dropdown-toggle .dd-text { color: var(--text-primary); }
    .nav-dropdown.open .nav-dropdown-toggle .dd-text::after { width: 100%; }
    .nav-dropdown.open .nav-dropdown-toggle .dd-arrow { transform: rotate(180deg); }
    .nav-dropdown-toggle.active .dd-text { color: var(--text-primary); }
    .nav-dropdown-toggle.active .dd-text::after { width: 100%; }

    .nav-dropdown-menu {
      position: absolute; top: calc(100% + 16px); left: 50%;
      transform: translateX(-50%) translateY(-8px);
      min-width: 250px; list-style: none; margin: 0; padding: 8px;
      background: var(--nav-scrolled);
      backdrop-filter: blur(22px) saturate(1.3);
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      border: 1px solid var(--glass-border); border-radius: 14px;
      box-shadow: 0 18px 45px var(--shadow-color);
      opacity: 0; visibility: hidden;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
      z-index: 1002;
    }
    .nav-dropdown.open .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .nav-dropdown-menu li { list-style: none; }
    .nav-dropdown-menu a {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 14px; border-radius: 9px;
      font-size: 0.85rem; font-weight: 500;
      color: var(--text-secondary); white-space: nowrap;
      transition: background var(--transition), color var(--transition);
    }
    .nav-dropdown-menu a::after { display: none !important; }
    .nav-dropdown-menu a:hover,
    .nav-dropdown-menu a:focus-visible { background: var(--accent-dim); color: var(--text-primary); outline: none; }
    .nav-dropdown-menu a i { width: 16px; text-align: center; font-size: 0.8rem; }

    .nav-toggle {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 6px;
    }
    .nav-toggle:hover { background: var(--accent-dim); }
    .nav-toggle span { display: block; width: 26px; height: 2px; background: var(--text-primary); border-radius: 4px; transition: all 0.3s ease; transform-origin: center; }
    .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    /* =========================================================
       FOOTER (auto-loaded from index.html)
       ========================================================= */
    .footer {
      padding: 48px 0 32px;
      border-top: 1px solid var(--footer-border);
      background: var(--bg-primary);
      transition: background 0.4s ease, border-color 0.3s ease;
      position: relative; overflow: hidden;
    }
    .footer .container { position: relative; z-index: 1; }
    .footer-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; }
    .footer-brand .fb-name { display: flex; align-items: center; }
    .footer-brand .fb-name img { height: 22px; width: auto; filter: var(--wordmark-filter); transition: filter 0.4s ease; }
    .footer-brand .fb-tagline { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 18px 28px; }
    .footer-links a { font-size: 0.8rem; color: var(--text-secondary); transition: color var(--transition); }
    .footer-links a:hover { color: var(--text-primary); }
    .footer-bottom { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--footer-border); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
    .footer-bottom p { font-size: 0.75rem; color: var(--text-muted); }

    /* =========================================================
       PAGE-SPECIFIC — BACKGROUND GRID
       ========================================================= */
    .background-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    [data-theme="light"] .background-grid {
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px);
    }

    /* =========================================================
       DEMOS SECTION
       ========================================================= */
    .demos-section {
      padding: 145px 0 110px;
      position: relative;
      z-index: 2;
    }

    /* =========================================================
       LOADING STATE
       ========================================================= */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 20px;
      color: var(--text-muted);
    }
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 0.9rem; letter-spacing: 0.05em; }

    /* =========================================================
       ERROR STATE
       ========================================================= */
    .error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      text-align: center;
      color: var(--text-muted);
    }
    .error-state i { font-size: 2.5rem; color: var(--text-muted); }
    .error-state p { font-size: 0.9rem; max-width: 400px; }
    .error-state button {
      padding: 10px 20px;
      border-radius: 50px;
      border: 1px solid var(--border-subtle);
      background: var(--accent-dim);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }
    .error-state button:hover { border-color: var(--accent); }

    /* =========================================================
       DEMOS GRID
       ========================================================= */
    .demos-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 28px;
    }

    /* =========================================================
       DEMO CARD
       ========================================================= */
    .demo-card {
      background: var(--demo-card-bg);
      border: 1px solid var(--demo-border);
      border-radius: var(--demo-radius);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 15px 45px var(--shadow-color);
      transition: transform 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease;
      opacity: 0;
      transform: translateY(35px);
      animation: cardReveal 0.7s ease forwards;
    }
    .demo-card:hover {
      transform: translateY(-8px);
      border-color: var(--demo-border-hover);
      box-shadow: 0 28px 60px var(--shadow-color), 0 0 45px var(--accent-glow);
    }
    @keyframes cardReveal {
      to { opacity: 1; transform: translateY(0); }
    }
    .demo-card:nth-child(1) { animation-delay: 0.05s; }
    .demo-card:nth-child(2) { animation-delay: 0.10s; }
    .demo-card:nth-child(3) { animation-delay: 0.15s; }
    .demo-card:nth-child(4) { animation-delay: 0.20s; }
    .demo-card:nth-child(5) { animation-delay: 0.25s; }
    .demo-card:nth-child(6) { animation-delay: 0.30s; }
    .demo-card:nth-child(7) { animation-delay: 0.35s; }
    .demo-card:nth-child(8) { animation-delay: 0.40s; }
    .demo-card:nth-child(9) { animation-delay: 0.45s; }
    .demo-card:nth-child(10) { animation-delay: 0.50s; }

    /* =========================================================
       LIVE WEBSITE PREVIEW
       ========================================================= */
    .demo-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #111;
      border-bottom: 1px solid var(--demo-border);
    }
    .demo-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      border: 0;
      transform: scale(0.5);
      transform-origin: top left;
      background: #000;
    }

    /* =========================================================
       PREVIEW BAR
       ========================================================= */
    .preview-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      z-index: 5;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .preview-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.65);
    }
    .preview-url {
      margin-left: 7px;
      font-size: 0.58rem;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       PREVIEW OVERLAY
       ========================================================= */
    .preview-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.25), transparent 30%);
    }

    /* =========================================================
       CARD BODY
       ========================================================= */
    .demo-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .demo-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }
    .demo-number {
      font-family: var(--font-display);
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .demo-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .demo-category {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 50px;
      background: var(--accent-dim);
      border: 1px solid var(--demo-border);
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .demo-description {
      color: var(--text-secondary);
      font-size: 0.84rem;
      line-height: 1.7;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */
    .demo-actions {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .demo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .demo-button.primary {
      background: var(--accent);
      color: var(--bg-primary);
      flex: 1;
    }
    .demo-button.primary:hover {
      transform: translateY(-2px);
      opacity: 0.82;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .demo-button.secondary {
      border: 1px solid var(--demo-border);
      color: var(--text-primary);
      background: transparent;
    }
    .demo-button.secondary:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* =========================================================
       CTA
       ========================================================= */
    .bottom-cta {
      margin-top: 70px;
      padding: 55px 35px;
      text-align: center;
      background: var(--accent-dim);
      border: 1px solid var(--demo-border);
      border-radius: var(--demo-radius);
      backdrop-filter: blur(10px);
    }
    .bottom-cta h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      margin-bottom: 12px;
    }
    .bottom-cta p {
      max-width: 650px;
      margin: 0 auto 24px;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 25px;
      border-radius: 50px;
      background: var(--accent);
      color: var(--bg-primary);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .cta-button:hover {
      transform: translateY(-2px);
      opacity: 0.85;
      box-shadow: 0 12px 30px var(--accent-glow);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (max-width: 1024px) {
      /* nothing extra */
    }
    @media (max-width: 900px) {
      .demos-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .nav-links {
        position: fixed; top: 0; right: -100%;
        width: 280px; height: 100vh; background: var(--bg-primary);
        backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        flex-direction: column; justify-content: center; align-items: center;
        gap: 28px; padding: 40px; overflow-y: auto;
        transition: right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        border-left: 1px solid var(--glass-border);
      }
      .nav-links.open { right: 0; }
      .nav-links a { font-size: 1.1rem; }
      .nav-toggle { display: flex; z-index: 1001; }
      .nav-cta { display: none; }
      .nav-links .nav-cta-mobile { display: inline-block; padding: 12px 32px; border-radius: 50px; background: var(--btn-primary-bg); color: var(--btn-primary-color); font-weight: 600; font-size: 0.9rem; margin-top: 8px; }
      .theme-toggle .toggle-text { display: none; }
      .nav-dropdown { width: 100%; text-align: center; }
      .nav-dropdown-toggle { width: 100%; justify-content: center; font-size: 1.1rem; }
      .nav-dropdown-menu {
        position: static; left: auto; top: auto; transform: none;
        min-width: 0; width: 100%; padding: 0; margin-top: 0;
        background: transparent; border: none; box-shadow: none;
        backdrop-filter: none; -webkit-backdrop-filter: none;
        opacity: 1; visibility: visible;
        max-height: 0; overflow: hidden;
        transition: max-height 0.35s ease, padding 0.35s ease;
      }
      .nav-dropdown.open .nav-dropdown-menu { transform: none; max-height: 520px; padding: 10px 0 0; }
      .nav-dropdown-menu a { justify-content: center; font-size: 1rem; padding: 10px 12px; }
    }
    @media (max-width: 480px) {
      .container { padding-left: 16px; padding-right: 16px; }
      .demos-section { padding-top: 125px; }
      .demo-body { padding: 20px; }
      .demo-top { flex-direction: column; gap: 8px; }
      .demo-category { align-self: flex-start; }
      .demo-actions { flex-direction: column; }
      .demo-button.secondary { width: 100%; }
      .bottom-cta { padding: 40px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-grid"></div>

  <!-- HEADER — auto-loaded from index.html -->
  <div id="site-header"></div>

  <main>
    <section class="demos-section">
      <div class="container">

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
          <div class="loading-spinner"></div>
          <p>Loading demos from GitHub...</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState">
          <i class="fas fa-triangle-exclamation"></i>
          <p>Unable to load demos right now. Please check your connection or try again later.</p>
          <button onclick="loadDemos()">Try Again</button>
        </div>

        <!-- Demos Grid (auto-populated) -->
        <div class="demos-grid" id="demosGrid"></div>

        <!-- CTA -->
        <div class="bottom-cta">
          <h2>Need a Website Like These?</h2>
          <p>DEEPBYTO builds modern, responsive, professional websites for businesses, startups, individuals, and organizations.</p>
          <a href="https://wa.me/923047467957?text=Hi%20DEEPBYTO%2C%20I'm%20interested%20in%20a%20professional%20website."
             target="_blank" rel="noopener noreferrer" class="cta-button">
            <i class="fab fa-whatsapp"></i> Contact DEEPBYTO
          </a>
        </div>

      </div>
    </section>
  </main>

  <!-- FOOTER — auto-loaded from index.html -->
  <div id="site-footer"></div>

  <script>
    'use strict';

    /* =========================================================
       THEME (shared with header)
       ========================================================= */
    function applyThemeUI(theme) {
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      if (themeIcon && themeLabel) {
        if (theme === 'light') {
          themeIcon.className = 'fas fa-sun';
          themeLabel.textContent = 'Light';
        } else {
          themeIcon.className = 'fas fa-moon';
          themeLabel.textContent = 'Dark';
        }
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'light' ? '#f5f5f5' : '#000000';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('deepbyto-theme', theme);
      applyThemeUI(theme);
    }

    const savedTheme = localStorage.getItem('deepbyto-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    /* =========================================================
       HEADER / FOOTER LOADER
       ========================================================= */
    async function loadComponent(templateId, targetSelector, sourcePage) {
      const target = document.querySelector(targetSelector);
      if (!target) return;
      const tpl = document.getElementById(templateId);
      if (tpl) { target.innerHTML = tpl.innerHTML; return; }
      try {
        const res = await fetch(sourcePage, { cache: 'no-store' });
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const remote = doc.getElementById(templateId);
        if (remote) target.innerHTML = remote.innerHTML;
      } catch (e) { console.error('Component load failed:', templateId, e); }
    }

    /* =========================================================
       HEADER EVENTS
       ========================================================= */
    function initHeaderEvents() {
      const navbar = document.getElementById('navbar');
      const navToggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');
      const themeToggle = document.getElementById('themeToggle');
      const navDropdowns = document.querySelectorAll('.nav-dropdown');

      applyThemeUI(document.documentElement.getAttribute('data-theme') || 'dark');

      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const cur = document.documentElement.getAttribute('data-theme');
          setTheme(cur === 'light' ? 'dark' : 'light');
        });
      }

      if (navbar) {
        const onScroll = () => {
          if (window.scrollY > 20) navbar.classList.add('scrolled');
          else navbar.classList.remove('scrolled');
        };
        window.addEventListener('scroll', onScroll);
        onScroll();
      }

      function closeAllDropdowns() {
        navDropdowns.forEach(dd => {
          dd.classList.remove('open');
          const t = dd.querySelector('.nav-dropdown-toggle');
          if (t) t.setAttribute('aria-expanded', 'false');
        });
      }

      if (navToggle && navLinks) {
        navToggle.addEventListener('click', () => {
          const open = navLinks.classList.toggle('open');
          navToggle.classList.toggle('active');
          navToggle.setAttribute('aria-expanded', open);
          if (!open) closeAllDropdowns();
        });
        navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', () => {
          navLinks.classList.remove('open');
          navToggle.classList.remove('active');
          navToggle.setAttribute('aria-expanded', 'false');
        }));
      }

      navDropdowns.forEach(dd => {
        const toggle = dd.querySelector('.nav-dropdown-toggle');
        if (!toggle) return;
        const ddText = toggle.querySelector('.dd-text');
        const ddArrow = toggle.querySelector('.dd-arrow');

        if (ddText && ddText.dataset.scroll) {
          ddText.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            const sec = ddText.dataset.scroll;
            const t = document.getElementById(sec);
            if (t) {
              const top = t.getBoundingClientRect().top + window.scrollY - 80;
              window.scrollTo({ top, behavior: 'smooth' });
            } else {
              window.location.href = '../index.html#' + sec;
            }
            closeAllDropdowns();
          });
        }

        if (ddArrow) {
          ddArrow.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            const willOpen = !dd.classList.contains('open');
            closeAllDropdowns();
            if (willOpen) { dd.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
          });
        }

        if (!ddText && !ddArrow) {
          toggle.addEventListener('click', (e) => {
            e.preventDefault(); e.stopPropagation();
            const willOpen = !dd.classList.contains('open');
            closeAllDropdowns();
            if (willOpen) { dd.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
          });
        }

        dd.querySelectorAll('.nav-dropdown-menu a').forEach(a => a.addEventListener('click', closeAllDropdowns));
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.nav-dropdown')) closeAllDropdowns();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeAllDropdowns();
      });
    }

    /* =========================================================
       GITHUB DEMOS CONFIG
       ========================================================= */
    const GITHUB_USER = 'DEEPBYTO';
    const GITHUB_REPO = 'demo-websites';
    const GITHUB_BRANCH = 'main';
    const LIVE_BASE_URL = `https://${GITHUB_USER.toLowerCase()}.github.io/${GITHUB_REPO}/`;

    const CATEGORY_MAP = {
      'gym':         { title: 'Gym & Fitness',      category: 'Business',       icon: 'fa-dumbbell',          description: 'A modern fitness website designed for gyms, fitness centers, personal trainers, and wellness businesses.' },
      'restaurant':  { title: 'Restaurant',          category: 'Food & Dining',  icon: 'fa-utensils',          description: 'A premium restaurant website focused on menu presentation, brand identity, reservations, and customer conversion.' },
      'ecommerce':   { title: 'E-Commerce',          category: 'Online Store',   icon: 'fa-bag-shopping',      description: 'A modern online store experience designed for product discovery, mobile shopping, and digital commerce.' },
      'portfolio':   { title: 'Personal Portfolio',  category: 'Portfolio',      icon: 'fa-user',              description: 'A professional portfolio experience for developers, designers, creators, freelancers, and professionals.' },
      'realestate':  { title: 'Real Estate',         category: 'Property',       icon: 'fa-building',          description: 'A professional property website concept designed for agencies, property listings, and real estate businesses.' },
      'business':    { title: 'Business Website',    category: 'Corporate',      icon: 'fa-building-circle-check', description: 'A flexible professional website concept for companies, agencies, startups, organizations, and service businesses.' }
    };

    function getFallbackMeta(folderName) {
      const formatted = folderName
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
      return {
        title: formatted,
        category: 'Website',
        icon: 'fa-globe',
        description: `A professional ${formatted} website demo developed by DEEPBYTO.`
      };
    }

    async function fetchRepoContents() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;
      const response = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
      if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
      return await response.json();
    }

    function renderCards(folders) {
      const grid = document.getElementById('demosGrid');
      grid.innerHTML = '';
      const dirs = folders.filter(item => item.type === 'dir');

      if (dirs.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No demos found yet. Check back soon!</p>';
        return;
      }

      dirs.forEach((dir, index) => {
        const folderName = dir.name;
        const meta = CATEGORY_MAP[folderName] || getFallbackMeta(folderName);
        const liveUrl = `${LIVE_BASE_URL}${folderName}/`;
        const displayUrl = `deepbyto.github.io/demo-websites/${folderName}/`;
        const number = String(index + 1).padStart(2, '0');
        const total = String(dirs.length).padStart(2, '0');

        const card = document.createElement('article');
        card.className = 'demo-card';
        card.innerHTML = `
          <div class="demo-preview">
            <div class="preview-bar">
              <span class="preview-dot"></span>
              <span class="preview-dot"></span>
              <span class="preview-dot"></span>
              <span class="preview-url">${displayUrl}</span>
            </div>
            <iframe
              src="${liveUrl}"
              title="${meta.title} Website Demo"
              loading="lazy"
              scrolling="no"
            ></iframe>
            <div class="preview-overlay"></div>
          </div>
          <div class="demo-body">
            <div class="demo-top">
              <div>
                <div class="demo-number">${number} / ${total}</div>
                <h3 class="demo-title">${meta.title}</h3>
              </div>
              <span class="demo-category">${meta.category}</span>
            </div>
            <p class="demo-description">${meta.description}</p>
            <div class="demo-actions">
              <a href="${liveUrl}" target="_blank" rel="noopener noreferrer" class="demo-button primary">
                View Live Demo <i class="fas fa-arrow-up-right-from-square"></i>
              </a>
              <a href="https://wa.me/923047467957?text=Hi%20DEEPBYTO%2C%20I'm%20interested%20in%20the%20${encodeURIComponent(meta.title)}%20Website."
                 target="_blank" rel="noopener noreferrer" class="demo-button secondary">
                <i class="fab fa-whatsapp"></i> Inquire
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadDemos() {
      const loadingState = document.getElementById('loadingState');
      const errorState = document.getElementById('errorState');
      const grid = document.getElementById('demosGrid');

      loadingState.style.display = 'flex';
      errorState.style.display = 'none';
      grid.innerHTML = '';

      try {
        const contents = await fetchRepoContents();
        loadingState.style.display = 'none';
        renderCards(contents);
      } catch (err) {
        console.error('Failed to load demos:', err);
        loadingState.style.display = 'none';
        errorState.style.display = 'flex';
      }
    }

    /* =========================================================
       BOOT
       ========================================================= */
    (async function boot() {
      await Promise.all([
        loadComponent('header-template', '#site-header', '../index.html'),
        loadComponent('footer-template', '#site-footer', '../index.html')
      ]);
      initHeaderEvents();
      loadDemos();
      console.log('DEEPBYTO | Demos initialized');
    })();
  </script>
</body>
</html>
