  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {

    }
    [data-theme="light"] {
      --bg-primary: #f5f5f5; --bg-secondary: #eeeeee; --bg-card: rgba(255,255,255,0.85);
      --accent: #000000; --accent-dim: rgba(0,0,0,0.08); --accent-glow: rgba(0,0,0,0.15);
      --text-primary: #111111; --text-secondary: #333333; --text-muted: #666666;
      --border-subtle: rgba(0,0,0,0.1); --glass-bg: rgba(255,255,255,0.7);
      --glass-border: rgba(0,0,0,0.12); --shadow-color: rgba(0,0,0,0.15);
      --btn-primary-bg: #000000; --btn-primary-color: #ffffff; --btn-primary-hover: #333333;
      --btn-secondary-border: rgba(0,0,0,0.25); --btn-secondary-hover-bg: rgba(0,0,0,0.08);

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    .theme-toggle { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--glass-border); border-radius: 50px; padding: 6px 14px 6px 10px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all var(--transition); font-family: var(--font-sans); background: var(--badge-bg); }

    .navbar.scrolled { background: var(--nav-scrolled); backdrop-filter: blur(24px) saturate(1.3); -webkit-backdrop-filter: blur(24px) saturate(1.3); box-shadow: 0 4px 25px var(--shadow-color); }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; }

    .nav-cta:hover { background: var(--btn-primary-hover); color: var(--btn-primary-color) !important; transform: translateY(-1px); box-shadow: 0 8px 20px var(--accent-glow); }
    .nav-cta::after { display: none !important; }
    .nav-dropdown { position: relative; list-style: none; }
    .nav-dropdown-toggle { display: inline-flex; align-items: center; gap: 7px; background: none; border: none; cursor: pointer; padding: 0; font-family: var(--font-sans); font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.02em; transition: color var(--transition); position: relative; }
    .nav-dropdown-toggle .dd-text { position: relative; }
    .nav-dropdown-toggle .dd-text::after { content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 2px; background: var(--accent); transition: width var(--transition); border-radius: 4px; }
    .nav-dropdown-toggle:hover .dd-text { color: var(--text-primary); }
    .nav-dropdown-toggle:hover .dd-text::after { width: 100%; }
    .nav-dropdown-toggle .dd-arrow { display: inline-flex; align-items: center; justify-content: center; font-size: 0.6rem; transition: transform 0.3s ease; padding: 4px; border-radius: 4px; cursor: pointer; }
    .nav-dropdown-toggle .dd-arrow:hover { background: var(--accent-dim); }
    .nav-dropdown.open .nav-dropdown-toggle .dd-text { color: var(--text-primary); }
    .nav-dropdown.open .nav-dropdown-toggle .dd-text::after { width: 100%; }
    .nav-dropdown.open .nav-dropdown-toggle .dd-arrow { transform: rotate(180deg); }
    .nav-dropdown-toggle.active .dd-text { color: var(--text-primary); }
    .nav-dropdown-toggle.active .dd-text::after { width: 100%; }
    .nav-dropdown-menu { position: absolute; top: calc(100% + 16px); left: 50%; transform: translateX(-50%) translateY(-8px); min-width: 250px; list-style: none; margin: 0; padding: 8px; background: var(--nav-scrolled); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid var(--glass-border); border-radius: 14px; box-shadow: 0 18px 45px var(--shadow-color); opacity: 0; visibility: hidden; transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease; z-index: 1002; }
    .nav-dropdown.open .nav-dropdown-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .nav-dropdown-menu li { list-style: none; }
    .nav-dropdown-menu a { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 9px; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); white-space: nowrap; transition: background var(--transition), color var(--transition); }
    .nav-dropdown-menu a::after { display: none !important; }
    .nav-dropdown-menu a:hover, .nav-dropdown-menu a:focus-visible { background: var(--accent-dim); color: var(--text-primary); outline: none; }
    .nav-dropdown-menu a i { width: 16px; text-align: center; font-size: 0.8rem; }

    .nav-toggle:hover { background: var(--accent-dim); }

    .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

    /* ===== PAGE HERO ===== */
    .page-hero { position: relative; min-height: 60vh; display: flex; align-items: center; padding: 160px 0 80px; overflow: hidden; background-color: #0a0a0a; isolation: isolate; }
    .page-hero-bg { position: absolute; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; filter: brightness(0.5) contrast(1.05) saturate(1.05); }

    .section-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem,4vw,3rem); letter-spacing: -0.02em; margin-bottom: 16px; line-height: 1.15; color: var(--text-primary); }
    .section-title .highlight { color: var(--text-primary); }
    .section-desc { color: var(--text-secondary); max-width: 640px; font-size: 1.05rem; line-height: 1.7; }

    /* ===== BLOG GRID (empty by default) ===== */
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 40px; }
    .blog-grid:empty { display: none; }

    .footer .container { position: relative; z-index: 1; }
    .footer-grid { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; }
    .footer-brand .fb-name { display: flex; align-items: center; }

    .footer-links { display: flex; flex-wrap: wrap; gap: 18px 28px; }

    .footer-bottom p { font-size: 0.75rem; color: var(--text-muted); }

    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .nav-links { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: var(--bg-primary); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); flex-direction: column; justify-content: center; align-items: center; gap: 28px; padding: 40px; overflow-y: auto; transition: right 0.4s cubic-bezier(0.25,0.46,0.45,0.94); border-left: 1px solid var(--glass-border); }
      .nav-links.open { right: 0; }
      .nav-links a { font-size: 1.1rem; }
      .nav-toggle { display: flex; z-index: 1001; }
      .nav-cta { display: none; }
      .nav-links .nav-cta-mobile { display: inline-block; padding: 12px 32px; border-radius: 50px; background: var(--btn-primary-bg); color: var(--btn-primary-color); font-weight: 600; font-size: 0.9rem; margin-top: 8px; }

    @media (prefers-reduced-motion: reduce) { .reveal { transition: none; } }

  <script>
    (function () {
      'use strict';

      /* ================= THEME ================= */
      function applyThemeUI(theme) {
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        if (themeIcon && themeLabel) {
          if (theme === 'light') {
            themeIcon.className = 'fas fa-sun';
            themeLabel.textContent = 'Light';
          } else {
            themeIcon.className = 'fas fa-moon';
            themeLabel.textContent = 'Dark';
          }
        }
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'light' ? '#f5f5f5' : '#000000';
      }
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('deepbyto-theme', theme);
        applyThemeUI(theme);
      }
      const savedTheme = localStorage.getItem('deepbyto-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);

      /* ================= PARTICLES ================= */
      const canvas = document.getElementById('particles-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 60;
        let mouseX = null, mouseY = null;
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        class Particle {
          constructor() { this.reset(); }
          reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.3;
            this.speedX = (Math.random() - 0.5) * 0.2;
            this.speedY = (Math.random() - 0.5) * 0.2;
            this.opacity = Math.random() * 0.3 + 0.05;
          }
          update() {
            this.x += this.speedX; this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) { this.speedX *= -1; this.x += this.speedX; }
            if (this.y < 0 || this.y > canvas.height) { this.speedY *= -1; this.y += this.speedY; }
            if (mouseX !== null && mouseY !== null) {
              const dx = this.x - mouseX, dy = this.y - mouseY;
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < 100) { const force = (100 - dist) / 100 * 0.01; this.x += dx * force; this.y += dy * force; }
            }
          }
          draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            ctx.fillStyle = isLight ? `rgba(0,0,0,${this.opacity*1.5})` : `rgba(255,255,255,${this.opacity})`;
            ctx.fill();
          }
        }
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
        function drawLines() {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          for (let i = 0; i < particles.length; i++) for (let j = i+1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 100) {
              const opacity = (1 - dist/100) * (isLight ? 0.2 : 0.15);
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = isLight ? `rgba(0,0,0,${opacity})` : `rgba(255,255,255,${opacity})`;
              ctx.lineWidth = 0.4;
              ctx.stroke();
            }
          }
        }
        function animateParticles() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (const p of particles) { p.update(); p.draw(); }
          drawLines();
          requestAnimationFrame(animateParticles);
        }
        animateParticles();
        document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        document.addEventListener('mouseleave', () => { mouseX = null; mouseY = null; });
      }

      /* ================= HEADER / FOOTER LOADER ================= */
      async function loadComponent(templateId, targetSelector, sourcePage) {
        const target = document.querySelector(targetSelector);
        if (!target) return;
        const tpl = document.getElementById(templateId);
        if (tpl) { target.innerHTML = tpl.innerHTML; return; }
        try {
          const res = await fetch(sourcePage, { cache: 'no-store' });
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const remote = doc.getElementById(templateId);
          if (remote) target.innerHTML = remote.innerHTML;
        } catch (e) { console.error('Component load failed:', templateId, e); }
      }

      /* ================= HEADER EVENTS ================= */
      function initHeaderEvents() {
        const navbar = document.getElementById('navbar');
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        const themeToggle = document.getElementById('themeToggle');
        const navDropdowns = document.querySelectorAll('.nav-dropdown');

        applyThemeUI(document.documentElement.getAttribute('data-theme') || 'dark');

        if (themeToggle) {
          themeToggle.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme');
            setTheme(cur === 'light' ? 'dark' : 'light');
          });
        }
        if (navbar) {
          const onScroll = () => {
            if (window.scrollY > 20) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
          };
          window.addEventListener('scroll', onScroll); onScroll();
        }
        function closeAllDropdowns() {
          navDropdowns.forEach(dd => {
            dd.classList.remove('open');
            const t = dd.querySelector('.nav-dropdown-toggle');
            if (t) t.setAttribute('aria-expanded', 'false');
          });
        }
        if (navToggle && navLinks) {
          navToggle.addEventListener('click', () => {
            const open = navLinks.classList.toggle('open');
            navToggle.classList.toggle('active');
            navToggle.setAttribute('aria-expanded', open);
            if (!open) closeAllDropdowns();
          });
          navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', () => {
            navLinks.classList.remove('open');
            navToggle.classList.remove('active');
            navToggle.setAttribute('aria-expanded', 'false');
          }));
        }
        navDropdowns.forEach(dd => {
          const toggle = dd.querySelector('.nav-dropdown-toggle');
          if (!toggle) return;
          const ddText = toggle.querySelector('.dd-text');
          const ddArrow = toggle.querySelector('.dd-arrow');
          if (ddText && ddText.dataset.scroll) {
            ddText.addEventListener('click', (e) => {
              e.preventDefault(); e.stopPropagation();
              const sec = ddText.dataset.scroll;
              const t = document.getElementById(sec);
              if (t) {
                const top = t.getBoundingClientRect().top + window.scrollY - 80;
                window.scrollTo({ top, behavior: 'smooth' });
              } else {
                window.location.href = '../index.html#' + sec;
              }
              closeAllDropdowns();
            });
          }
          if (ddArrow) {
            ddArrow.addEventListener('click', (e) => {
              e.preventDefault(); e.stopPropagation();
              const willOpen = !dd.classList.contains('open');
              closeAllDropdowns();
              if (willOpen) { dd.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
            });
          }
          if (!ddText && !ddArrow) {
            toggle.addEventListener('click', (e) => {
              e.preventDefault(); e.stopPropagation();
              const willOpen = !dd.classList.contains('open');
              closeAllDropdowns();
              if (willOpen) { dd.classList.add('open'); toggle.setAttribute('aria-expanded', 'true'); }
            });
          }
          dd.querySelectorAll('.nav-dropdown-menu a').forEach(a => a.addEventListener('click', closeAllDropdowns));
        });
        document.addEventListener('click', e => {
          if (!e.target.closest('.nav-dropdown')) closeAllDropdowns();
        });
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') closeAllDropdowns();
        });
      }

      /* ================= REVEAL ================= */
      const revealElements = document.querySelectorAll('.reveal');
      function revealOnScroll() {
        const wh = window.innerHeight;
        revealElements.forEach(el => {
          const r = el.getBoundingClientRect();
          if (r.top < wh - 100) el.classList.add('visible');
        });
      }
      window.addEventListener('scroll', revealOnScroll);
      window.addEventListener('resize', revealOnScroll);

      /* ================= GITHUB AUTO-FETCH ARTICLES ================= */
      const GITHUB_USER = 'DEEPBYTO';
      const GITHUB_REPO = 'deepbyto.github.io';
      const ARTICLES_PATH = 'Articles & Blogs';

      async function fetchArticlesFromGitHub() {
        const grid = document.getElementById('blogGrid');
        if (!grid) return;

        try {
          const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${encodeURIComponent(ARTICLES_PATH)}`;
          const res = await fetch(apiUrl);

          if (!res.ok) return;

          const files = await res.json();

          const articles = files.filter(f =>
            f.type === 'file' && (f.name.endsWith('.md') || f.name.endsWith('.html'))
          );

          if (articles.length === 0) return;

          articles.forEach((file) => {
            const fileName = file.name.replace(/\.(md|html)$/i, '');
            const title = fileName.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            const isHtml = file.name.endsWith('.html');
            const articleUrl = isHtml
              ? `../Articles%20%26%20Blogs/${encodeURIComponent(file.name)}`
              : file.html_url;

            const card = document.createElement('a');
            card.href = articleUrl;
            card.className = 'blog-card reveal';
            card.target = isHtml ? '_self' : '_blank';
            card.rel = 'noopener noreferrer';

            card.innerHTML = `
              <div class="blog-media">
                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);font-size:3rem;color:var(--text-muted);">
                  <i class="fas fa-file-lines"></i>
                </div>
              </div>
              <div class="blog-body">
                <h3>${title}</h3>
                <span class="article-read">Read more <i class="fas fa-arrow-right"></i></span>
              </div>
            `;

            grid.appendChild(card);
          });

          setTimeout(() => {
            grid.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
          }, 100);

        } catch (err) {
          console.error('GitHub fetch error:', err);
        }
      }

      /* ================= BOOT ================= */
      (async function boot() {
        await Promise.all([
          loadComponent('header-template', '#site-header', '../index.html'),
          loadComponent('footer-template', '#site-footer', '../index.html')
        ]);
        initHeaderEvents();
        await fetchArticlesFromGitHub();
        setTimeout(revealOnScroll, 200);
        console.log('DEEPBYTO | Articles & Blogs initialized');
      })();
    })();
  </script>
</body>
